<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXA - Hasil Ujian TIU</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(#fff, #ffecec);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        background: white;
        width: 100%;
        max-width: 420px;
        padding: 28px 22px;
        border-radius: 20px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        text-align: center;
        animation: fadeIn 0.6s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo {
        width: 80px;
        margin-bottom: 10px;
      }

      h2 {
        font-family: "Poppins", sans-serif;
        color: #8b0000;
        margin-bottom: 5px;
      }

      .sub {
        font-size: 14px;
        color: #777;
        margin-bottom: 20px;
      }

      .data {
        text-align: left;
        margin-bottom: 15px;
      }

      .data div {
        margin-bottom: 6px;
        font-size: 14px;
      }

      .data span {
        font-weight: 600;
      }

      .score-box {
        background: linear-gradient(135deg, #8b0000, #ff4d4d);
        color: white;
        border-radius: 18px;
        padding: 20px;
        margin: 20px 0;
      }

      .score-box small {
        font-size: 13px;
        opacity: 0.9;
      }

      .score {
        font-family: "Poppins", sans-serif;
        font-size: 52px;
        font-weight: 700;
        margin-top: 5px;
      }

      .status {
        margin-top: 10px;
        font-weight: 600;
        font-size: 14px;
      }

      .lulus {
        color: #2e7d32;
      }

      .tidak {
        color: #c62828;
      }

      .btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.3s;
      }

      .btn-main {
        background: linear-gradient(135deg, #c00000, #ff3b3b);
        color: white;
        box-shadow: 0 6px 15px rgba(192, 0, 0, 0.3);
      }

      .btn-main:hover {
        transform: translateY(-2px);
      }

      .note {
        font-size: 13px;
        color: #555;
        margin-top: 15px;
      }

      .footer {
        margin-top: 20px;
        font-size: 12px;
        color: #888;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <img src="img/Logo-1.png" class="logo" />

      <h2>NEXA TIU RESULT</h2>
      <div class="sub">Simulasi Seleksi Paskibraka</div>

      <div class="data">
        <div>Nama: <span id="n"></span></div>
        <div>Sekolah: <span id="s"></span></div>
        <div>Daerah: <span id="d"></span></div>
      </div>

      <div class="score-box">
        <small>Nilai Akhir</small>
        <div class="score" id="v">0</div>
      </div>

      <!-- STATUS -->
      <div id="statusText" class="status"></div>

      <button class="btn btn-main" onclick="lihatPembahasan()">
        Lihat Pembahasan
      </button>

      <div class="note">
        Terus tingkatkan kemampuanmu.<br />
        Paskibraka bukan hanya seleksi, tapi pembentukan karakter.
      </div>

      <div class="footer">© NEXA TRYOUT</div>
    </div>

    <script>
      const nama = localStorage.getItem("nama") || "-";
      const sekolah = localStorage.getItem("sekolah") || "-";
      const daerah = localStorage.getItem("daerah") || "-";
      const nilai = parseInt(localStorage.getItem("nilai") || "0");

      document.getElementById("n").textContent = nama;
      document.getElementById("s").textContent = sekolah;
      document.getElementById("d").textContent = daerah;
      document.getElementById("v").textContent = nilai;

      // STATUS LOGIC
      const statusText = document.getElementById("statusText");

      if (nilai >= 80) {
        statusText.textContent = "Sangat Siap Seleksi!";
        statusText.className = "status lulus";
      } else if (nilai >= 60) {
        statusText.textContent = "Cukup Siap, Perlu Latihan";
        statusText.className = "status";
      } else {
        statusText.textContent = "Perlu Banyak Latihan";
        statusText.className = "status tidak";
      }

      function lihatPembahasan() {
        window.location.href = "pembahasan.html";
      }
    </script>
  </body>
</html>
